services:
  - type: web
    name: sevaiq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_PROVIDER_PRIORITY
        value: gemini
      - key: AI_REQUEST_TIMEOUT
        value: "20.0"
      - key: AI_MAX_TRANSIENT_RETRIES
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
